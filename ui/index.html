<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TreeView</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><rect width="24" height="24" rx="6" fill="url(#lg)"/><rect x="5" y="5.5" width="13" height="2.6" rx="1.3" fill="#fbbf24"/><rect x="6.5" y="9.5" width="10" height="2.6" rx="1.3" fill="#fde047"/><rect x="8" y="13.5" width="7" height="2.6" rx="1.3" fill="#fff" opacity=".8"/><rect x="9.5" y="17.5" width="4" height="2" rx="1" fill="#fff" opacity=".5"/><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>
      <span>TreeView</span>
    </div>

    <div class="group">
      <div class="dd">
        <button class="btn primary" id="btnSelect" aria-haspopup="menu">
          <svg viewBox="0 0 20 20" class="ti"><path d="M2.5 6A1.5 1.5 0 0 1 4 4.5h3.6l1.6 1.6H16A1.5 1.5 0 0 1 17.5 7.6V15A1.5 1.5 0 0 1 16 16.5H4A1.5 1.5 0 0 1 2.5 15z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Select Directory
          <svg viewBox="0 0 20 20" class="ti sm"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="menu" id="menuSelect" role="menu" hidden></div>
      </div>
      <button class="btn" id="btnStop" disabled title="Stop scan (Esc)">
        <svg viewBox="0 0 20 20" class="ti"><rect x="5" y="5" width="10" height="10" rx="2" fill="currentColor"/></svg>Stop
      </button>
      <button class="btn" id="btnRefresh" disabled title="Rescan (F5)">
        <svg viewBox="0 0 20 20" class="ti"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Refresh
      </button>
    </div>

    <div class="group">
      <span class="glabel">Mode</span>
      <div class="seg" id="segMode" role="radiogroup" aria-label="Mode">
        <button data-v="size" class="on">Size</button><button data-v="alloc">Allocated</button><button data-v="files">File Count</button><button data-v="percent">Percent</button>
      </div>
    </div>

    <div class="group">
      <span class="glabel">Unit</span>
      <div class="seg" id="segUnit" role="radiogroup" aria-label="Unit">
        <button data-v="auto" class="on">Auto</button><button data-v="GB">GB</button><button data-v="MB">MB</button><button data-v="KB">KB</button>
      </div>
    </div>

    <div class="group">
      <div class="dd">
        <button class="btn" id="btnExpand" disabled aria-haspopup="menu">
          <svg viewBox="0 0 20 20" class="ti"><path d="M4 4.5h5M7 8.5h5M10 12.5h6M4 4.5v12h3M7 8.5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Expand
          <svg viewBox="0 0 20 20" class="ti sm"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="menu" id="menuExpand" role="menu" hidden>
          <button data-lvl="1">Level 1</button>
          <button data-lvl="2">Level 2</button>
          <button data-lvl="3">Level 3</button>
          <button data-lvl="4">Level 4</button>
          <hr />
          <button data-lvl="0">Collapse all</button>
        </div>
      </div>
    </div>

    <div class="spacer"></div>
    <button class="btn icon" id="btnAbout" title="About" aria-label="About">
      <svg viewBox="0 0 20 20" class="ti"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="6.4" r="1.05" fill="currentColor"/></svg>
    </button>
    <button class="btn icon" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 20 20" class="ti"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
    </button>
  </header>

  <main id="main">
    <section id="welcome">
      <div class="hero">
        <h1>What would you like to analyze?</h1>
        <p>Pick a drive or folder. Every core is used to walk the file system in parallel.</p>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <section id="tree" hidden>
      <div class="tbody" id="tbody" tabindex="0" aria-label="Folder tree">
        <div class="thead" id="thead"></div>
        <div class="canvas" id="canvas"><div id="rows"></div></div>
      </div>
    </section>

    <div id="progress" hidden>
      <div class="pcard">
        <div class="spin"></div>
        <div class="ptitle">Scanning <b id="pPath"></b></div>
        <div class="pstats">
          <div><span id="pFiles">0</span><label>Files</label></div>
          <div><span id="pDirs">0</span><label>Folders</label></div>
          <div><span id="pBytes">0</span><label>Size</label></div>
          <div><span id="pRate">0</span><label>Files / sec</label></div>
        </div>
        <div class="pcur" id="pCur">&nbsp;</div>
        <button class="btn" id="pStop">Stop</button>
      </div>
    </div>
  </main>

  <footer class="status" id="status"><span>Ready</span></footer>
  <dialog id="confirm" class="modal" aria-labelledby="cfTitle">
    <div class="cf-head">
      <svg viewBox="0 0 20 20" class="cf-ico" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h12M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5.5 5.5l.7 10a1.5 1.5 0 0 0 1.5 1.4h4.6a1.5 1.5 0 0 0 1.5-1.4l.7-10M8.5 9v5M11.5 9v5"/></svg>
      <h3 id="cfTitle"></h3>
    </div>
    <p id="cfBody"></p>
    <form method="dialog" class="cf-actions">
      <button class="btn" value="no" autofocus>Cancel</button>
      <button class="btn danger" value="yes" id="cfOk"></button>
    </form>
  </dialog>
  <dialog id="about" class="modal" aria-labelledby="aboutName">
    <div class="ab-head">
      <div class="avatar" id="abAvatar"></div>
      <div>
        <h2 id="aboutName"></h2>
        <div class="ab-role" id="abRole"></div>
      </div>
    </div>
    <p class="ab-bio" id="abBio"></p>
    <div class="ab-links" id="abLinks"></div>
    <div class="ab-app">
      <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><rect width="24" height="24" rx="6" fill="url(#lg)"/><rect x="5" y="5.5" width="13" height="2.6" rx="1.3" fill="#fbbf24"/><rect x="6.5" y="9.5" width="10" height="2.6" rx="1.3" fill="#fde047"/><rect x="8" y="13.5" width="7" height="2.6" rx="1.3" fill="#fff" opacity=".8"/></svg>
      <div><b>TreeView</b> <span id="abVer"></span><div class="ab-sub">Fast disk space analyzer · Rust + Tauri</div></div>
    </div>
    <form method="dialog"><button class="btn primary" autofocus>Close</button></form>
  </dialog>
  <div class="ctx" id="ctx" role="menu" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
